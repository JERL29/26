<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>26 Meses</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: lienzo pixel art a pantalla completa; capas HTML para portada, etiqueta de escena, subtítulos y mensaje final */
:root{
  --bg:#1b1340;
  --fg:#fff7f0;
  --accent:#ff5c8a;
  --gold:#ffd166;
  --gold-dark:#b8861b;
  --muted:#c9b8ff;
  --display:"Press Start 2P","Courier New",monospace;
  --body:"Pixelify Sans","Trebuchet MS",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}

.overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:18px;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:opacity .8s ease;
}
.overlay.out{opacity:0;pointer-events:none}
#intro{background:rgba(27,19,64,.62)}
#intro h1{font-family:var(--display);font-size:clamp(26px,8vw,52px);margin:0;color:var(--gold);text-shadow:4px 4px 0 #7a1f3a;text-wrap:balance;line-height:1.3}
#intro .sub{font-size:clamp(18px,4.5vw,26px);margin:0;color:var(--fg);max-width:30ch;line-height:1.3}
#intro .eyebrow{font-family:var(--display);font-size:clamp(8px,2.4vw,11px);letter-spacing:.12em;color:var(--muted);margin:0;line-height:1.8}

.btn{
  font-family:var(--display);font-size:clamp(9px,2.6vw,12px);letter-spacing:.5px;color:#1b1340;background:var(--gold);
  border:0;padding:14px 22px;cursor:pointer;
  box-shadow:0 4px 0 var(--gold-dark),0 0 0 3px #1b1340;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dark),0 0 0 3px #1b1340}
.btn:focus-visible{outline:3px solid #fff;outline-offset:4px}

#final{justify-content:flex-start;padding-top:calc(42vh + env(safe-area-inset-top,0px));gap:10px;pointer-events:none;opacity:0;transition:opacity 1.4s ease}
#final.in{opacity:1}
#final h2{font-family:var(--display);font-size:clamp(13px,3.6vw,22px);margin:0;color:var(--gold);text-shadow:3px 3px 0 #7a1f3a;line-height:1.5;text-wrap:balance}
#final .dias{font-family:var(--display);font-size:clamp(8px,2.2vw,11px);letter-spacing:.08em;color:var(--muted);margin:0;line-height:1.8;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
#final p.msg{margin:0;max-width:34ch;font-size:clamp(18px,4.6vw,26px);line-height:1.35;color:var(--fg);text-shadow:0 2px 0 rgba(0,0,0,.6)}
#final .firma{margin:0;font-weight:600;color:var(--accent);font-size:clamp(20px,5vw,30px);text-shadow:0 2px 0 rgba(0,0,0,.6)}
#final .btn{pointer-events:auto;margin-top:8px;opacity:0;transition:opacity .8s}
#final.replay .btn{opacity:1}

#sceneLabel{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  font-family:var(--display);font-size:clamp(7px,2vw,10px);letter-spacing:.1em;color:#fff;
  text-shadow:2px 2px 0 rgba(0,0,0,.7);opacity:0;transition:opacity .6s;pointer-events:none;line-height:1.8;max-width:60vw
}
#sceneLabel.in{opacity:1}

#caption{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:min(92vw, 44ch);box-sizing:border-box;
  background:rgba(13,8,40,.78);color:var(--fg);
  font-size:clamp(17px,4.4vw,24px);line-height:1.3;text-align:center;
  padding:10px 16px;border:2px solid rgba(255,255,255,.25);
  opacity:0;transition:opacity .5s;pointer-events:none;text-wrap:balance
}
#caption.in{opacity:1}

.hud{
  position:fixed;top:calc(8px + env(safe-area-inset-top,0px));
  background:rgba(27,19,64,.55);color:#fff;border:2px solid rgba(255,255,255,.6);font-family:var(--display);
  font-size:9px;padding:8px 10px;cursor:pointer;z-index:5
}
.hud:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#mute{right:max(12px,env(safe-area-inset-right,0px))}
#skip{right:max(12px,env(safe-area-inset-right,0px));top:calc(48px + env(safe-area-inset-top,0px))}
#musicBtn{left:50%;transform:translateX(-50%);top:calc(40% + env(safe-area-inset-top,0px));font-size:11px;padding:14px 18px;background:var(--accent);border-color:#fff;z-index:6}
@media (prefers-reduced-motion:reduce){.overlay,#final,#sceneLabel,#caption{transition:none}}
</style>

<canvas id="c" aria-label="Animación pixel art en ocho escenas: cómo nos conocimos en Física Mecánica, las tres primeras salidas, el primer beso y el 16 de agosto"></canvas>
<div id="sceneLabel"></div>
<div id="caption"></div>
<button id="mute" class="hud" type="button" aria-label="Silenciar">SONIDO ON</button>
<button id="skip" class="hud" type="button" hidden>SALTAR ›</button>
<button id="musicBtn" class="hud" type="button" hidden>♪ TOCA PARA ACTIVAR LA MÚSICA</button>

<div id="intro" class="overlay">
  <p class="eyebrow">NUESTRA HISTORIA EN OCHO ESCENAS</p>
  <h1>26 meses</h1>
  <p class="sub">Esta es nuestra historia, desde Física Mecánica hasta hoy. Dale play.</p>
  <button id="start" class="btn" type="button">EMPEZAR ♥</button>
</div>

<div id="final" class="overlay">
  <h2 id="finalTitle"></h2>
  <p id="finalDias" class="dias"></p>
  <p id="finalMsg" class="msg"></p>
  <p id="finalFirma" class="firma"></p>
  <button id="replay" class="btn" type="button">VER DE NUEVO</button>
</div>

<script>
// ====== CAMBIA AQUÍ LOS TEXTOS DE LA HISTORIA ======
const CONFIG = {
  nombreEl:   'Juan',
  nombreElla: 'Laura',
  clase:      'Física Mecánica',
  fechaNovios: { anio: 2024, mes: 8, dia: 16 },
  fechaTexto: '16 de agosto de 2024',
  textos: {
    s1a: 'Universidad, 2024. Llevábamos dos semestres caminando por los mismos pasillos.',
    s1b: 'Tú siempre con tus tres amigas. Yo, solo. Nunca nos habíamos visto.',
    s2a: 'Hasta Física Mecánica. El primer día, todo el salón reunido, de pie.',
    s2b: 'Llegaste y te hiciste a mi lado. Yo te vi. Tú a mí, todavía no.',
    s2c: '"Escojan grupos". Dos compañeros se te acercaron... y yo también.',

    s2e: 'Y un compañero que estaba solo se hizo con nosotros. Grupo de tres.',
    s3:  'Nuestro grupo de física. Tú resolvías los problemas. Yo ya no podía concentrarme.',
    s4a: 'Nuestra primera salida: el centro de Bogotá. Fuimos a comer hamburguesa.',
    s4b: 'Y luego a la biblioteca. En ese balcón hablamos y hablamos.',

    s5b: '...hasta un parque. Nos acostamos en el pasto y seguimos hablando de todo.',
    s6:  'La tercera salida: el Jardín Botánico. Nuestro primer beso.',
    s7:  'Después de eso, cada paso que di iba hacia ti.',
    s8:  '16 de agosto de 2024. La pregunta más fácil y más importante de mi vida.',
  },
  globos: {
    amiga:    'jajaja',
    prof:     'Escojan grupos.',
    chico:    '¿Hacemos grupo?',
    el2:      '¿Nos hacemos todos?',
    chicosSi: '¡Sí!',
    chicosNo: 'Nos equivocamos de salón...',
    compa:    '¿Me hago con ustedes?',
    ella2:    '¡Claro!',
    ella3:    '¿Entendiste?',
    el3:      '...sí',
    el8:      '¿Quieres ser mi novia?',
    ella8:    '¡Sí!',
  },
  titulo:  '¡Feliz mes, mi amor!',
  mensaje: 'Cada obstáculo valió la pena porque al final te encontré, y yo te seguiré eligiendo hasta el final de los tiempos.',
  firma:   'Te adoro, mi pinsheshita peciosa ♥',

  // ====== MÚSICA ======
  // inicio = segundo de la canción donde empieza el pedacito. volumen de 0 a 1.
  musica: {
    volumenGeneral: 0.9,
    canciones: {
      coco:    { archivo: 'musica/Vicente_Garc_a_-_Dulcito_e_Coco_(mp3.pm).mp3',  inicio: 0,  volumen: 0.85 },
      techo:   { archivo: 'musica/Chocquibtown_-_Hasta_El_Techo_(mp3.pm).mp3',    inicio: 45, volumen: 0.85 },
      magia:   { archivo: 'musica/Lil_Silvio_El_Vega_-_Tienes_La_Magia_(mp3.pm).mp3', inicio: 60, volumen: 0.9 },
      gracias: { archivo: 'musica/Calibre_50_-_Simplemente_Gracias_(mp3.pm).mp3', inicio: 45, volumen: 0.9 },
      eres:    { archivo: 'musica/Cafe_Tacvba_-_Eres_me_encanta_mi_favorita_jijijijijijji_(mp3.pm).mp3', inicio: 0, volumen: 1 },
    },
    // qué canción suena en cada escena (1 a 8). Si se repite, la canción sigue sin cortarse.
    escenas: ['coco', 'coco', 'coco', 'techo', 'techo', 'magia', 'gracias', 'eres'],
  },
};
// ===================================================

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const introEl = document.getElementById('intro');
const finalEl = document.getElementById('final');
const sceneLabel = document.getElementById('sceneLabel');
const captionEl = document.getElementById('caption');
const muteBtn = document.getElementById('mute');
const skipBtn = document.getElementById('skip');

document.getElementById('finalTitle').textContent = CONFIG.titulo;
document.getElementById('finalMsg').textContent = CONFIG.mensaje;
document.getElementById('finalFirma').textContent = CONFIG.firma;
(function(){
  const f = CONFIG.fechaNovios;
  const inicio = new Date(f.anio, f.mes - 1, f.dia);
  const dias = Math.floor((Date.now() - inicio.getTime()) / 86400000);
  document.getElementById('finalDias').textContent = dias.toLocaleString('es') + ' DÍAS DESDE EL ' + CONFIG.fechaTexto.toUpperCase();
})();

const U = 4;
const G = 900, JV = 340;
let W = 800, H = 450, GY = 380, scale = 1, dpr = 1;
const PX = '"Press Start 2P", monospace';

const COL = { skin:'#f6c9a0', eye:'#1b1340', mouth:'#b44a4a', blush:'#ff9aa8', heart:'#ff3b6b', heartLight:'#ff9ec0', ink:'#1b1340' };
const LOOK = {
  el:     { hair:'#3b2a1e', top:'#3a7bd5', topDark:'#2d62ad', legs:'#2c3e6b', shoes:'#2b2b2b', dress:false, longHair:false },
  ella:   { hair:'#5a2a16', top:'#ff5c8a', topDark:'#d93d6c', legs:'#f6c9a0', shoes:'#7a1f3a', dress:true, longHair:true, flower:true },
  prof:   { hair:'#c9c9c9', top:'#4b6b4a', topDark:'#3a553a', legs:'#3a3a3a', shoes:'#222222', dress:false, longHair:false, glasses:true },
  amiga1: { hair:'#1f1f1f', top:'#7c5cff', topDark:'#5a3fd1', legs:'#f6c9a0', shoes:'#333333', dress:true, longHair:true },
  amiga2: { hair:'#1a1210', skin:'#9c6540', top:'#2fbf9f', topDark:'#239a80', legs:'#9c6540', shoes:'#333333', dress:true, longHair:true },
  amiga3: { hair:'#6b3b1e', top:'#ffb347', topDark:'#e0902a', legs:'#2c3e6b', shoes:'#333333', dress:false, longHair:true },
  chico1: { hair:'#1f1f1f', top:'#d9534f', topDark:'#b23b38', legs:'#2b2b2b', shoes:'#111111', dress:false, longHair:false },
  chico2: { hair:'#1a1210', skin:'#8d5a3b', top:'#f0ad4e', topDark:'#c98a2e', legs:'#3b4b6b', shoes:'#111111', dress:false, longHair:false },
  compa:  { hair:'#1a1210', skin:'#7a4a2e', top:'#6c757d', topDark:'#545b62', legs:'#2c3e6b', shoes:'#222222', dress:false, longHair:false, glasses:true },
  est1:   { hair:'#3a2a1a', top:'#20c997', topDark:'#17a383', legs:'#2b2b2b', shoes:'#111111', dress:false, longHair:false },
  est2:   { hair:'#111111', top:'#e83e8c', topDark:'#c42f74', legs:'#f6c9a0', shoes:'#333333', dress:true, longHair:true },
};

function makeChar(who){ return { who, x:0, lane:0, oy:0, vy:0, facing:1, walking:false, jumping:false, lean:0, lie:0, kissing:false, happy:false, blush:false }; }
const el = makeChar('el'), ella = makeChar('ella'), prof = makeChar('prof');
const amiga1 = makeChar('amiga1'), amiga2 = makeChar('amiga2'), amiga3 = makeChar('amiga3');
const chico1 = makeChar('chico1'), chico2 = makeChar('chico2'), compa = makeChar('compa');
const est1 = makeChar('est1'), est2 = makeChar('est2');
const ALL = [el, ella, prof, amiga1, amiga2, amiga3, chico1, chico2, compa, est1, est2];
prof.happy = true; amiga1.happy = amiga2.happy = amiga3.happy = true;

let scene = null, story = null, started = false, skip = false;
let T = 0, fade = 0;
let obstacles = [], flowers = [], stars = [], fireflies = [], hearts = [], bubbles = [];
let bigHeart = null;

// ---------- tamaño ----------
function resize(){
  const vw = innerWidth, vh = innerHeight, a = vw / vh;
  const oldW = W;
  if (a >= 1.25){ H = 400; W = Math.round(H * a); } else { W = 520; H = Math.round(W / a); }
  GY = H - (a >= 1.25 ? 72 : 130);
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  scale = vw / W;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (oldW !== W){ ALL.forEach(p => { p.x = p.x / oldW * W; }); }
  if (scene && scene.layout) scene.layout();
}
function seed(i){ const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function wrap(v, m){ return ((v % m) + m) % m; }

// ---------- audio ----------
let AC = null, muted = false;
function initAudio(){ if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; } }
function tone(freq, dur, type, vol, when){
  if (!AC || muted) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    const t0 = AC.currentTime + (when || 0);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol*0.6, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch(e){}
}
const sfxJump  = () => { tone(330,0.12,'square',0.05,0); tone(540,0.14,'square',0.05,0.07); };
const sfxMeet  = () => { tone(660,0.1,'square',0.05,0); tone(880,0.18,'square',0.05,0.1); };
const sfxPop   = () => { tone(740,0.07,'square',0.035,0); };
const sfxKiss  = () => { [523,659,784,1047].forEach((f,i)=>tone(f,0.3,'triangle',0.07,i*0.09)); };
const sfxHeart = () => { [392,494,587,784,988].forEach((f,i)=>tone(f,1.1,'sine',0.06,i*0.16)); };
const sfxYes   = () => { [659,784,988,1319].forEach((f,i)=>tone(f,0.18,'square',0.05,i*0.07)); };
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? 'SONIDO OFF' : 'SONIDO ON';
  muteBtn.setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar');
  player.muted = muted;
});
skipBtn.addEventListener('click', () => { skip = true; });

// ---------- música ----------
// Un solo reproductor que cambia de canción: es lo más compatible con iPhone, Android y PC.
const player = new Audio();
player.preload = 'auto';
player.setAttribute('playsinline', '');
const musicBtn = document.getElementById('musicBtn');
let curId = null, pendingId = null, pVol = 0, pTarget = 0, duck = 1, musicOn = false;
function song(id){ return CONFIG.musica.canciones[id]; }
function tryPlay(){
  try {
    const p = player.play();
    if (p && p.then) p.then(() => { musicBtn.hidden = true; }).catch(() => { if (musicOn) musicBtn.hidden = false; });
  } catch(e){ if (musicOn) musicBtn.hidden = false; }
}
function loadSong(id){
  const c = song(id); if (!c) return;
  pendingId = null; curId = id; pVol = 0; pTarget = 1;
  player.volume = 0;
  player.src = encodeURI(c.archivo);
  const go = () => { try { player.currentTime = c.inicio || 0; } catch(e){} };
  if (player.readyState >= 1) go(); else player.addEventListener('loadedmetadata', go, { once: true });
  player.muted = muted;
  tryPlay();
}
function musicFor(i){
  const id = CONFIG.musica.escenas[i];
  if (!song(id) || id === curId || id === pendingId) return;
  if (!curId || player.paused){ loadSong(id); return; }
  pendingId = id; pTarget = 0;
}
function stopMusic(){
  try { player.pause(); } catch(e){}
  curId = null; pendingId = null; pVol = 0; pTarget = 0;
}
function musicTick(dt){
  if (!musicOn) return;
  duck += ((bubbles.length ? 0.75 : 1) - duck) * Math.min(1, dt*3);
  const step = dt / 1.2;
  if (pVol < pTarget) pVol = Math.min(pTarget, pVol + step);
  else if (pVol > pTarget) pVol = Math.max(pTarget, pVol - step);
  if (pendingId && pVol === 0){ loadSong(pendingId); return; }
  const c = song(curId);
  const v = c ? pVol * c.volumen * CONFIG.musica.volumenGeneral * duck : 0;
  try { player.volume = Math.max(0, Math.min(1, v)); } catch(e){}
}
musicBtn.addEventListener('click', () => { if (!curId) musicFor(0); tryPlay(); });

// ---------- personitas ----------
function drawPerson(p, t){
  const L = LOOK[p.who];
  const SK = L.skin || COL.skin;
  ctx.save();
  ctx.translate(Math.round(p.x), Math.round(GY - p.lane - p.oy));
  if (p.lie) ctx.rotate(p.lie * Math.PI/2);
  if (p.lean) ctx.rotate(p.lean);
  ctx.scale(p.facing, 1);
  const r = (ux,uy,uw,uh,c) => { ctx.fillStyle = c; ctx.fillRect(ux*U, uy*U, uw*U, uh*U); };
  const f = (p.walking && !p.jumping) ? Math.floor(t*8) % 2 : -1;
  let lx = -3, rx = 1;
  if (f === 0){ lx = -4; rx = 2; } else if (f === 1){ lx = -2; rx = 0; }
  const legLen = p.jumping ? 3 : (L.dress ? 3 : 4);
  r(lx, -1-legLen, 2, legLen, L.legs); r(rx, -1-legLen, 2, legLen, L.legs);
  r(lx, -1, 2, 1, L.shoes); r(rx, -1, 2, 1, L.shoes);
  if (f === 1) ctx.translate(0, -U);
  if (p.jumping) ctx.translate(0, U);
  if (L.dress){ r(-5,-5,10,2,L.top); r(-4,-7,8,2,L.top); r(-3,-11,6,4,L.top); r(-5,-4,10,1,L.topDark); r(-3,-9,6,1,L.topDark); }
  else { r(-3,-11,6,6,L.top); r(-1,-11,2,6,L.topDark); }
  let aL = -10, aR = -10;
  if (p.jumping){ aL = -14; aR = -14; } else if (f === 0){ aL = -11; aR = -9; } else if (f === 1){ aL = -9; aR = -11; }
  const armC = L.dress ? SK : L.top;
  r(-4, aL, 1, 4, armC); r(3, aR, 1, 4, armC);
  r(-4, aL+4, 1, 1, SK); r(3, aR+4, 1, 1, SK);
  r(-3,-17,6,6,SK);
  if (L.longHair){ r(-4,-18,8,2,L.hair); r(-4,-16,1,8,L.hair); r(3,-16,1,8,L.hair); r(-3,-16,2,1,L.hair); r(1,-16,2,1,L.hair); }
  else { r(-3,-18,6,2,L.hair); r(-4,-17,1,1,L.hair); r(3,-17,1,1,L.hair); r(-3,-16,1,1,L.hair); }
  if (L.flower){ r(3,-19,1,1,'#ffe066'); r(2,-18,1,1,'#ffe066'); }
  if (p.kissing){ ctx.fillStyle = COL.eye; ctx.fillRect(0, -15*U + U/2, U, U/2); ctx.fillRect(2*U, -15*U + U/2, U, U/2); }
  else { r(0,-15,1,1,COL.eye); r(2,-15,1,1,COL.eye); }
  if (L.glasses){ r(-1,-15,1,1,'#555'); r(1,-15,1,1,'#555'); r(3,-15,1,1,'#555'); }
  if (p.kissing) r(2,-13,1,1,'#e0607a');
  else if (p.happy) r(0,-13,2,1,COL.mouth);
  else r(1,-13,1,1,COL.mouth);
  if (p.blush){ r(-2,-14,1,1,COL.blush); r(2,-14,1,1,COL.blush); }
  ctx.restore();
}
function headPos(p){
  if (p.lie) return { x: p.x + p.lie*60, y: GY - p.lane - 30 };
  return { x: p.x, y: GY - p.lane - p.oy - 76 };
}

function label(text, x, y, font, color){
  ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillText(text, x+1, y+1);
  ctx.fillStyle = color || '#fff'; ctx.fillText(text, x, y);
}

// ---------- lógica de personajes ----------
function place(p, x, facing, lane){ p.x = x; p.facing = facing; p.lane = lane || 0; p.oy = 0; p.vy = 0; p.walking = false; p.jumping = false; p.lean = 0; p.lie = 0; p.kissing = false; }
function mood(p, happy, blush){ p.happy = happy; p.blush = blush; }
function moveChar(p, dt, targetX, speed){
  const d = Math.sign(targetX - p.x);
  if (Math.abs(targetX - p.x) <= speed*dt){ p.x = targetX; p.walking = false; return true; }
  p.facing = d; p.walking = true; p.x += d*speed*dt;
  if (!p.jumping){
    for (const o of obstacles){
      if (o.side !== p.who || o.done) continue;
      const near = d > 0 ? o.x1 : o.x2;
      const dist = (near - p.x)*d;
      if (dist > 0 && dist < 12){ o.done = true; p.jumping = true; p.vy = JV; sfxJump(); }
    }
  }
  return false;
}
function physics(p, dt){ if (p.jumping){ p.oy += p.vy*dt; p.vy -= G*dt; if (p.oy <= 0){ p.oy = 0; p.jumping = false; p.vy = 0; } } }
function spawnHeart(x, y){
  hearts.push({x, y, vx:(Math.random()-0.5)*26, vy:-(28 + Math.random()*30), life:0, max:2.2 + Math.random(), u: 2 + Math.random()*1.5, w:Math.random()*6});
}
const ease = x => 1 - Math.pow(1 - x, 3);

// ---------- secuenciador (generadores) ----------
function* wait(s){ let t = 0; while (t < s){ t += (yield) || 0; } }
function* walk(p, x, speed){ while (true){ const dt = (yield) || 0; if (moveChar(p, dt, x, speed)) return; } }
function* par(...gens){
  const done = gens.map(() => false);
  while (done.some(d => !d)){ const dt = (yield) || 0; gens.forEach((g,i) => { if (!done[i]) done[i] = g.next(dt).done; }); }
}
function* fadeTo(target, dur){
  const from = fade; let t = 0;
  while (t < dur){ t += (yield) || 0; fade = from + (target - from)*Math.min(1, t/dur); }
  fade = target;
}
function* say(p, text, dur, opts){
  const b = Object.assign({p, text}, opts || {});
  bubbles.push(b); sfxPop();
  yield* wait(dur);
  const i = bubbles.indexOf(b); if (i >= 0) bubbles.splice(i, 1);
}
function* chat(a, b, n, dur){
  for (let i = 0; i < n; i++){ yield* say(i % 2 ? b : a, '...', dur); yield* wait(0.15); }
}
function* heartsFor(dur, x, y, every){
  let t = 0, acc = 0;
  while (t < dur){ const dt = (yield) || 0; t += dt; acc += dt; if (acc >= every){ acc = 0; spawnHeart(x + (Math.random()-0.5)*16, y); } }
}
function* leanIn(dur, k0){
  let t = 0; const K = k0 == null ? 0.22 : k0;
  while (t < dur){ t += (yield) || 0; const k = ease(Math.min(1, t/dur))*K; el.lean = k; ella.lean = -k; }
}

  }
  ending = true; skipBtn.hidden = true; caption('');
  finalEl.classList.add('in');

  if (story){ story.next(dt); }
  musicTick(dt);
  ALL.forEach(p => physics(p, dt));
  hearts.forEach(h => { h.life += dt; h.x += (h.vx + Math.sin(h.life*4 + h.w)*14)*dt; h.y += h.vy*dt; });
  hearts = hearts.filter(h => h.life < h.max);
}

  const t = T;

    const nameFont = '8px ' + PX;

      const hp = headPos(p);
      label(p === el ? CONFIG.nombreEl : CONFIG.nombreElla, hp.x, hp.y - 6, nameFont);
    });
  }
  bubbles.forEach(drawBubble);
  hearts.forEach(h => drawHeart(h.x, h.y, h.u, COL.heart, COL.heartLight, Math.max(0, 1 - h.life/h.max)));
  if (bigHeart){
    const pulse = ending ? Math.sin(t*5)*0.35 : 0;
    const u = bigHeart.u + pulse;
    const gl = ctx.createRadialGradient(bigHeart.x, bigHeart.y, 4, bigHeart.x, bigHeart.y, u*9);
    gl.addColorStop(0, 'rgba(255,92,138,.45)'); gl.addColorStop(1, 'rgba(255,92,138,0)');
    ctx.fillStyle = gl; ctx.fillRect(bigHeart.x - u*9, bigHeart.y - u*9, u*18, u*18);
    drawHeart(bigHeart.x, bigHeart.y, u, COL.heart, COL.heartLight);
    if (u > 6){ ctx.globalAlpha = Math.min(1, (u-6)/3); label('26', bigHeart.x, bigHeart.y + 6, '16px ' + PX); ctx.globalAlpha = 1; }
  }
  if (fade > 0){ ctx.fillStyle = 'rgba(13,8,40,' + fade + ')'; ctx.fillRect(0, 0, W, H); }
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now; T += dt;
  update(dt); draw();
  requestAnimationFrame(frame);
}

function begin(){
  fade = 1; hearts = []; bubbles = []; bigHeart = null; ending = false; skip = false;
  finalEl.classList.remove('in'); finalEl.classList.remove('replay');
  sceneLabel.classList.add('in'); skipBtn.hidden = false;
  started = true;
  musicOn = true; stopMusic(); musicFor(0);
  story = master();
}
document.getElementById('start').addEventListener('click', () => {
  initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  introEl.classList.add('out');
  begin();
});
document.getElementById('replay').addEventListener('click', begin);

addEventListener('resize', resize);
scene = SCENES[0];
resize();
scene.setup();
document.fonts && document.fonts.load('8px "Press Start 2P"').catch(() => {});
requestAnimationFrame(frame);
</script>
